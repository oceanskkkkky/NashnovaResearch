<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:540px;height:720px;background:#18332d;font-family:STSong,"Songti SC",SimSun,serif;color:#f8f2e5;display:flex;flex-direction:column;justify-content:space-between;padding:44px 40px;border:6px solid #b98532}
.top{display:flex;align-items:center;gap:12px}
.seal{width:46px;height:46px;display:grid;place-items:center;border:2px solid #c99d55;color:#e8c887;font-size:28px;font-weight:700}
.brand{font-size:24px;font-weight:700;letter-spacing:.12em}
.brand small{display:block;font-size:11px;letter-spacing:.2em;color:#c9d2ca;margin-top:4px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.mid{text-align:left}
.date{color:#b98532;font-size:15px;letter-spacing:.15em;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
h1{font-size:64px;line-height:1.2;margin:14px 0 10px;color:#f8f2e5}
h1 strong{color:#e8c887}
.sub{font-size:24px;color:#d7ddd4;line-height:1.5}
.sub strong{color:#e8c887}
.bottom{display:flex;gap:12px;font-size:16px}
.pill{flex:1;border:1px solid rgba(232,200,135,.5);padding:12px 14px;color:#e8c887}
.pill b{display:block;font-size:13px;color:#c9d2ca;margin-bottom:4px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
</style>
</head>
<body>
<div class="top"><span class="seal">历</span><div class="brand">股市老黄历<small>A-SHARE DAILY RESEARCH</small></div></div>
<div class="mid">
<div class="date">评分交易日 2026-08-21 · 休市版</div>
<h1>今日<br><strong>缩量分化</strong></h1>
<div class="sub">资金抱团资源主线<br><strong>3只入选股</strong> 回调观察清单</div>
</div>
<div class="bottom">
<div class="pill"><b>今日宜</b>跟踪回调中的资源龙头</div>
<div class="pill"><b>今日忌</b>追高连板题材</div>
</div>
</body>
</html>
